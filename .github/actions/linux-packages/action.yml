name: Linux packages
description: >-
    Builds the Linux x64 packages (AppImage, deb, rpm, pacman and tar.gz) into release/, runs the packaged-app E2E
    tests against them, and installs the pacman package in a clean Arch Linux container. Expects the repository to be
    checked out and Node.js to be set up. Used by ci.yml and release.yml.

runs:
    using: composite
    steps:
        - name: Install packaging tools and Electron runtime libraries
          shell: bash
          run: |
              sudo apt-get -o Acquire::Retries=3 update
              # bsdtar (libarchive-tools) is needed for the pacman package and rpmbuild (rpm) for the rpm package.
              sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libarchive-tools rpm xvfb \
                  libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
                  libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libayatana-appindicator3-1 \
                  libxtst6
              # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron needs.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

        - name: Install dependencies
          uses: ./.github/actions/retry-command
          with:
              command: npm ci

        - name: Build and package
          shell: bash
          run: npm run dist:linux

        - name: Packaged-app E2E tests
          shell: bash
          # wdio-electron-service starts Xvfb itself, so do not wrap this in xvfb-run.
          run: npm run test:e2e:release

        - name: Install the pacman package on Arch Linux
          shell: bash
          run: >-
              docker run --rm
              -v "$PWD/release:/pkgs:ro"
              -v "$PWD/scripts/release:/scripts:ro"
              ghcr.io/archlinux/archlinux:latest
              bash /scripts/check-arch-install.sh /pkgs
