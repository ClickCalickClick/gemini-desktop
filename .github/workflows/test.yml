# =============================================================================
# GitHub Actions Test Workflow
# =============================================================================
#
# The full cross-platform test matrix: unit tests with coverage, plus the
# integration and E2E suites on Windows, macOS and Ubuntu (about 48 jobs).
# Run it by hand from the Actions tab, for example before a release.
# ci.yml is the gate for pushes and pull requests.
#
# =============================================================================

name: Test

# =============================================================================
# Trigger Configuration
# =============================================================================
on:
    workflow_dispatch:

# =============================================================================
# Permissions
# =============================================================================
# Restrict default GITHUB_TOKEN permissions (OpenSSF Scorecard best practice)
# Jobs declare their own permissions as needed
permissions: {}

# =============================================================================
# Concurrency Control
# =============================================================================
# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# =============================================================================
# Jobs
# =============================================================================
jobs:
    # Build application
    build:
        permissions:
            contents: read
        uses: ./.github/workflows/_build.yml

    # Run tests with coverage uploads enabled
    test:
        needs: build
        permissions:
            contents: read
        uses: ./.github/workflows/_test.yml
        with:
            upload-coverage: true
            e2e-fail-fast: false
            artifact-suffix: ''

    # Aggregate results
    test-complete:
        name: Test Complete
        needs: [build, test]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        if: always()

        steps:
            - name: Check Job Results
              run: |
                  echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  # Check build
                  if [ "${{ needs.build.result }}" == "success" ]; then
                    echo "✅ Build: Passed" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
                  fi

                  # Check tests
                  if [ "${{ needs.test.result }}" == "success" ]; then
                    echo "✅ Tests: Passed (all platforms)" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Fail if Any Job Failed
              if: |
                  needs.build.result != 'success' ||
                  needs.test.result != 'success'
              run: |
                  echo "One or more jobs failed. See summary above for details."
                  exit 1
