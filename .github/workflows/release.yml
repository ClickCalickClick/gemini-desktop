# =============================================================================
# Release
# =============================================================================
#
# Pushing a v* tag (or running this workflow with a tag) checks the tag against
# package.json, runs lint and the unit tests, builds the Linux and Windows
# installers with their packaged-app tests, and creates or updates a DRAFT
# GitHub release. Publishing the draft is a manual step, and it is what makes
# the update visible to installed apps.
#
# Running it from the Actions tab without a tag builds the selected branch and
# keeps the installers as workflow artifacts, without touching any release.
#
# macOS is built by hand for now (TODO.md, Phase 3).
# =============================================================================

name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to release, e.g. v0.13.0. Leave empty to build the branch without releasing.'
                required: false
                default: ''

# Jobs declare their own permissions; only the publish job can write.
permissions: {}

concurrency:
    group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
    cancel-in-progress: false

env:
    TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    CI: true
    ELECTRON_ENABLE_LOGGING: true
    npm_config_fetch_retries: '3'
    npm_config_fetch_retry_mintimeout: '10000'
    npm_config_fetch_retry_maxtimeout: '60000'

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: ${{ env.TAG }}

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Check that the tag matches package.json
              if: env.TAG != ''
              run: |
                  expected="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$expected" ]; then
                      echo "::error::Tag $TAG does not match the package.json version ($expected)."
                      exit 1
                  fi

            - name: Install dependencies
              uses: ./.github/actions/retry-command
              with:
                  command: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build && npm run build:electron

            - name: Unit tests
              run: npm run test && npm run test:electron && npm run test:coordinated

    linux:
        name: Linux (x64)
        needs: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: ${{ env.TAG }}

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Build, test and install the Linux packages
              uses: ./.github/actions/linux-packages

            - name: Checksums
              working-directory: release
              run: sha256sum -- *.AppImage *.deb *.rpm *.pacman *.tar.gz > checksums-linux.txt

            - name: Upload E2E logs and screenshots
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: linux-e2e-logs
                  path: |
                      tests/e2e/screenshots/
                      tests/e2e/logs/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Upload the Linux packages
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-linux
                  path: |
                      release/*.AppImage
                      release/*.deb
                      release/*.rpm
                      release/*.pacman
                      release/*.tar.gz
                      release/latest-linux.yml
                      release/checksums-linux.txt
                  retention-days: 7
                  if-no-files-found: error

    windows:
        name: Windows (${{ matrix.arch }})
        needs: verify
        runs-on: windows-latest
        timeout-minutes: 90
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      checksums: checksums-windows.txt
                    - arch: arm64
                      checksums: checksums-windows-arm64.txt
        env:
            npm_config_arch: ${{ matrix.arch }}
        steps:
            - name: Checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: ${{ env.TAG }}

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              uses: ./.github/actions/retry-command
              with:
                  command: npm ci

            - name: Build and package
              # Signs only when all the AZURE_* secrets exist; without them the installer is unsigned.
              run: npm run dist:win-${{ matrix.arch }}
              shell: bash
              env:
                  AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
                  AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
                  AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
                  AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

            # arm64 is cross-built on an x64 runner, so only the x64 build can be launched here.
            - name: Packaged-app E2E tests
              if: matrix.arch == 'x64'
              run: npm run test:e2e:release
              shell: bash
              timeout-minutes: 30

            - name: Install with the NSIS installer and launch the installed app
              if: matrix.arch == 'x64'
              shell: bash
              env:
                  EXPECTED_WINDOWS_ARCH: x64
              run: |
                  installer=$(ls release/*-x64-installer.exe)
                  node scripts/run-windows-installer-smoke.cjs --release-dir release --install-root .wdio-test-data/windows-smoke-x64 --result-path release/installer-smoke-manifest.json --installer "$installer"
                  npm run test:e2e:release:installer -- --spec=tests/e2e/release/windows-installer-smoke.spec.ts

            - name: Update feeds and checksums
              shell: pwsh
              working-directory: release
              run: |
                  if (!(Test-Path latest.yml)) { throw 'electron-builder did not write latest.yml.' }
                  # The app reads latest-<arch>.yml. <arch>.yml and the x64 latest.yml serve installs of older versions.
                  Copy-Item -Path latest.yml -Destination 'latest-${{ matrix.arch }}.yml' -Force
                  Copy-Item -Path latest.yml -Destination '${{ matrix.arch }}.yml' -Force
                  if ('${{ matrix.arch }}' -eq 'arm64') { Remove-Item -Path latest.yml -Force }
                  $files = @(Get-ChildItem -Path *-installer.exe -File)
                  if ($files.Count -eq 0) { throw 'No installer found in release/.' }
                  $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File '${{ matrix.checksums }}'

            - name: Upload E2E logs and screenshots
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: windows-${{ matrix.arch }}-e2e-logs
                  path: |
                      tests/e2e/screenshots/
                      tests/e2e/logs/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Upload the Windows installer
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-windows-${{ matrix.arch }}
                  path: |
                      release/*-installer.exe
                      release/*-installer.exe.blockmap
                      release/latest*.yml
                      release/${{ matrix.arch }}.yml
                      release/${{ matrix.checksums }}
                  retention-days: 7
                  if-no-files-found: error

    publish:
        name: Draft GitHub release
        needs: [linux, windows]
        if: github.event_name == 'push' || inputs.tag != ''
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Download the installers
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: dist-*
                  merge-multiple: true
                  path: dist

            - name: Create or update the draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ls -l dist
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
                  else
                      gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                          --title "Gemini Desktop $TAG" --generate-notes
                  fi
